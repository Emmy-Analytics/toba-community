<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
</head>

<body>
  <div id="out">loading…</div>
  <script>
    window.tobaHeroCallback = function (res) {
      window.__heroRes = res;
      document.getElementById('out').textContent = 'OK total=' + res.total + ' n=' + res.photos.length;
    };
  </script>
  <script
    src="https://script.google.com/macros/s/AKfycbxgx0kHXRa7uR3PuADKiEgvs_sLHp0U9UbxHsxkPwWl9kjlCZnQWa6iZBa1NW9tjrcLvg/exec?api=hero&callback=tobaHeroCallback"></script>
  <div id="imgtest"></div>
  <script>
    window.__runTest = async function () {
      const res = window.__heroRes;
      const out = [];
      for (const p of res.photos.slice(0, 3)) {
        const img = new Image();
        const r = await new Promise(ok => {
          img.onload = () => ok({ ok: true, w: img.naturalWidth, h: img.naturalHeight });
          img.onerror = (e) => ok({ ok: false });
          img.src = p.imageUrl;
          setTimeout(() => ok({ ok: false, timeout: true }), 12000);
        });
        out.push({ id: p.photoId, url: p.imageUrl, ...r });
      }
      document.getElementById('imgtest').textContent = JSON.stringify(out);
      return out;
    };
  </script>
</body>

</html>
